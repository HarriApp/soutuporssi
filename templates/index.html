{% extends "layout.html" %}

{% block content %}
<h2>Joukkueet</h2>
<ul>
  {% for team in teams %}
  <li>
    <a href="/team/{{ team.id }}">{{ team.name }}</a> 
    sarjassa {{ team.description }}
  </li>
  {% endfor %}
</ul>
{% if not teams %}
<p>Ei vielä yhtään joukkuetta</p>
{% endif %}
{% if session.username %}
<a href="/create_team">Kokoa uusi joukkue</a>
{% endif %}
{% endblock %}
