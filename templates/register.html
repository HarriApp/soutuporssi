{% extends "layout.html" %}

{% block content %}
<h2>Rekisteröinti</h2>
<p>{{ message }}</p>
{% if message != "Tunnus luotu" %}
<form action="/register" method="post">
  <p>
    Tunnus: <br />
    <input type="text" name="username" required minlength="2" 
    maxlength="20"/>
  </p>
  <p>
    Salasana: <br />
    <input type="password" name="password1" required minlength="2" 
    maxlength="20"/>
  </p>
  <p>
    Salasana uudestaan: <br />
    <input type="password" name="password2"/>
  </p>
  <input type="submit" value="Luo tunnus" />
</form>
{% else %}
<p>
  <a href="/login">Kirjaudu sisään</a>
</p>
{% endif %}
{% endblock %}
