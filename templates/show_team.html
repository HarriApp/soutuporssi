<!DOCTYPE html>
<html>

<head>
  <title>{{team.name}}</title>
</head>

<body>
  <h1>{{ team.name }}</h1>
  <p><i>{{ team.serie_description }}</i></p>
  <p>{{ team.description }}</p>
  <p>Kapteeni: {{ team.captain }}</p>
  <br>
  {% if session.user_id == team.captain_id %}
  <a href="/edit_team/{{ team.id }}">Muokkaa</a>
  <a href="/remove_team/{{ team.id }}">Poista</a>
  {% endif %}
  <a href="/">Takaisin etusivulle</a>
</body>

</html>
